name: Bug report
description: Report reproducible memtop behavior
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove private command-line arguments, tokens, and sensitive paths
        before posting process output.
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Linux Mint 22.3
    validations:
      required: true
  - type: input
    id: bash
    attributes:
      label: Bash version
      placeholder: bash 5.x
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
